<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Live Board Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg:#000; --surface:#0a0a0a; --surface-2:#121212; --surface-3:#1a1a1a;
    --border:#1f1f1f; --border-2:#2a2a2a; --text:#f5f5f5; --text-dim:#8a8a8a;
    --text-dimmer:#555; --danger:#e11d48; --success:#22c55e; --accent:#2b6aff;
    --header-h:52px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:13px;line-height:1.4;
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}

  /* HEADER */
  .header{
    height:var(--header-h);flex-shrink:0;
    display:flex;align-items:center;gap:10px;padding:0 14px;
    background:var(--surface);border-bottom:1px solid var(--border);
    position:relative;z-index:100;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px;flex-shrink:0}
  .brand-logo{
    width:26px;height:26px;border-radius:7px;background:var(--text);color:var(--bg);
    display:flex;align-items:center;justify-content:center;font-size:12px;
  }
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--text-dimmer);flex-shrink:0;transition:background .3s}
  .live-dot.on{background:var(--success);box-shadow:0 0 0 3px rgba(34,197,94,.15);animation:pulse 2s infinite}
  .live-dot.err{background:var(--danger);animation:none}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
  .role-tag{
    font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:3px 8px;border-radius:5px;background:var(--surface-3);color:var(--text-dim);border:1px solid var(--border);
  }
  .role-tag.host{background:var(--text);color:var(--bg);border-color:var(--text)}
  .header-spacer{flex:1}
  .link-bar{
    display:flex;align-items:center;gap:6px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:8px;padding:4px 4px 4px 12px;
    max-width:320px;min-width:0;
  }
  .link-bar .url{font-size:11px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .copy-btn{
    display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;
    background:var(--surface-3);color:var(--text);font-size:11px;font-weight:500;flex-shrink:0;
  }
  .copy-btn.ok{background:var(--success);color:#001a09}
  .copy-btn i{font-size:10px}
  .icon-btn{
    width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:transparent;color:var(--text-dim);flex-shrink:0;font-size:13px;
  }
  .icon-btn:hover{background:var(--surface-3);color:var(--text)}

  /* LAYOUT */
  .layout{flex:1;display:flex;overflow:hidden;position:relative;background:#fff}
  .stage{flex:1;position:relative;background:#fff;overflow:hidden;touch-action:none}
  #canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

  /* ZOOM CONTROLS */
  .zoom-ctrl{
    position:absolute;right:12px;top:12px;z-index:40;
    display:flex;flex-direction:column;gap:4px;
    background:rgba(10,10,10,.85);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--border-2);border-radius:10px;padding:4px;
    box-shadow:0 8px 24px -4px rgba(0,0,0,.6);
  }
  .zoom-ctrl button{
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    border-radius:6px;color:var(--text-dim);font-size:12px;
  }
  .zoom-ctrl button:hover{background:var(--surface-3);color:var(--text)}
  .zoom-ctrl .zoom-label{
    font-size:9px;text-align:center;color:var(--text-dimmer);
    padding:2px 0;font-family:'JetBrains Mono',monospace;
  }

  /* TEXT INPUT OVERLAY */
  .text-input{
    position:absolute;z-index:60;display:none;
    background:#fff;border:2px solid var(--accent);border-radius:4px;
    padding:2px 6px;outline:none;
    min-width:80px;color:#000;font-family:inherit;
    transform-origin:top left;
  }
  .text-input.show{display:block}

  /* FLOATING TOOLBAR */
  .fab{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:4px;padding:6px;
    background:rgba(10,10,10,.94);backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border-2);border-radius:16px;
    box-shadow:0 20px 40px -8px rgba(0,0,0,.9);
    z-index:50;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;
    padding-bottom:calc(6px + env(safe-area-inset-bottom));
  }
  .fab::-webkit-scrollbar{display:none}
  .fab.hidden{display:none}
  .fab .tool{
    width:36px;height:36px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:9px;color:var(--text-dim);font-size:13px;
  }
  .fab .tool:hover{background:var(--surface-3);color:var(--text)}
  .fab .tool.active{background:var(--text);color:var(--bg)}
  .fab .tool.danger:hover{background:var(--danger);color:#fff}
  .fab .divider{width:1px;height:22px;background:var(--border-2);margin:0 3px;flex-shrink:0}
  .fab .swatch{
    width:20px;height:20px;border-radius:50%;flex-shrink:0;
    cursor:pointer;border:2px solid transparent;
  }
  .fab .swatch.active{border-color:#fff;transform:scale(1.1)}
  .fab .swatch.white{border-color:#444}
  .fab .swatch.white.active{border-color:#fff}

  /* SIDEBAR */
  .sidebar{
    display:none;width:300px;flex-shrink:0;
    background:var(--surface);border-left:1px solid var(--border);
    overflow-y:auto;padding:16px;
  }
  .sidebar.viewer .side-section:not(:last-child) .tools-grid,
  .sidebar.viewer .side-section:not(:last-child) input[type=range],
  .sidebar.viewer .side-section:not(:last-child) .swatches-row,
  .sidebar.viewer .side-section:not(:last-child) .upload-btn,
  .sidebar.viewer .side-section:not(:last-child) .page-controls{pointer-events:none;opacity:.35}
  .side-section{margin-bottom:22px}
  .side-label{
    font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text-dimmer);margin-bottom:10px;display:flex;align-items:center;gap:6px;
  }
  .side-label i{font-size:10px}
  .tools-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .tool-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:10px 2px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;color:var(--text-dim);font-size:9px;font-weight:500;
  }
  .tool-btn i{font-size:14px}
  .tool-btn:hover{background:var(--surface-3);color:var(--text)}
  .tool-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}

  .swatches-row{display:flex;gap:7px;flex-wrap:wrap}
  .swatch-lg{
    width:26px;height:26px;border-radius:50%;cursor:pointer;
    border:2px solid transparent;
  }
  .swatch-lg.active{border-color:#fff;transform:scale(1.08)}
  .swatch-lg.white{border-color:#444}
  .swatch-lg.white.active{border-color:#fff}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;
    background:var(--surface-3);border-radius:2px;outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:16px;height:16px;
    border-radius:50%;background:var(--text);cursor:pointer;border:2px solid var(--surface);
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;background:var(--text);
    cursor:pointer;border:2px solid var(--surface);
  }
  .slider-head{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-bottom:8px}

  .upload-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;
    background:var(--surface-2);border:1px dashed var(--border-2);border-radius:8px;
    color:var(--text-dim);font-size:12px;font-weight:500;
  }
  .upload-btn:hover{background:var(--surface-3);color:var(--text);border-color:var(--text-dim)}
  .file-info{
    margin-top:10px;padding:10px;background:var(--surface-2);
    border-radius:8px;font-size:11px;color:var(--text-dim);
  }
  .file-info .name{color:var(--text);font-weight:500;display:block;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .page-controls{display:flex;gap:6px;margin-top:10px}
  .page-btn{
    flex:1;padding:9px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;color:var(--text-dim);font-size:11px;font-weight:500;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .page-btn:hover:not(:disabled){background:var(--surface-3);color:var(--text)}
  .page-btn:disabled{opacity:.35;cursor:not-allowed}
  .page-btn.remove:hover:not(:disabled){background:var(--danger);color:#fff}
  .status-line{
    display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--surface-2);
    border-radius:8px;font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;
  }
  .status-line i{font-size:10px;color:var(--text-dimmer)}
  .status-line.ok i{color:var(--success)}
  .status-line.err i{color:var(--danger)}
  .status-line .room{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* DRAWER */
  .drawer-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.7);
    backdrop-filter:blur(4px);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .drawer-backdrop.open{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;left:0;right:0;bottom:0;background:var(--surface);
    border-top:1px solid var(--border-2);border-radius:20px 20px 0 0;
    padding:10px 16px 24px;max-height:80vh;overflow-y:auto;z-index:201;
    transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  .drawer.open{transform:translateY(0)}
  .drawer-handle{width:36px;height:4px;border-radius:2px;background:var(--border-2);margin:0 auto 14px}

  @media(min-width:900px){
    .sidebar{display:block}
    .fab{display:none}
    .drawer,.drawer-backdrop{display:none}
  }
  @media(max-width:899px){
    .link-bar{max-width:160px}
    .copy-btn span{display:none}
    .brand-text{display:none}
  }
  @media(max-width:380px){
    .role-tag{font-size:9px;padding:2px 6px}
    .zoom-ctrl{right:8px;top:8px}
    .zoom-ctrl button{width:28px;height:28px}
  }
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <div class="brand-logo"><i class="fa-solid fa-chalkboard"></i></div>
    <span class="brand-text">Live Board</span>
    <span class="live-dot" id="liveDot"></span>
  </div>
  <span class="role-tag" id="roleTag">host</span>
  <div class="header-spacer"></div>
  <div class="link-bar">
    <span class="url mono" id="urlText">…</span>
    <button class="copy-btn" id="copyBtn"><i class="fa-regular fa-copy"></i><span>Copy</span></button>
  </div>
  <button class="icon-btn" id="menuBtn"><i class="fa-solid fa-sliders"></i></button>
</header>

<div class="layout">
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <input type="text" class="text-input" id="textInput" placeholder="Type…">
    <div class="zoom-ctrl" id="zoomCtrl">
      <button id="zoomIn" title="Zoom in"><i class="fa-solid fa-plus"></i></button>
      <div class="zoom-label" id="zoomLabel">100%</div>
      <button id="zoomOut" title="Zoom out"><i class="fa-solid fa-minus"></i></button>
      <button id="zoomReset" title="Reset view"><i class="fa-solid fa-expand"></i></button>
    </div>
  </div>

  <aside class="sidebar" id="sidebar">
    <div class="side-section">
      <div class="side-label"><i class="fa-solid fa-toolbox"></i> Drawing</div>
      <div class="tools-grid" id="toolsGridD"></div>
    </div>

    <div class="side-section">
      <div class="side-label"><i class="fa-solid fa-palette"></i> Color</div>
      <div class="swatches-row" id="colorsD"></div>
    </div>

    <div class="side-section">
      <div class="side-label"><i class="fa-solid fa-circle-half-stroke"></i> Size</div>
      <div class="slider-head"><span>Stroke</span><span class="mono" id="sizeVal">4px</span></div>
      <input type="range" id="sizeSlider" min="1" max="30" value="4">
    </div>

    <div class="side-section">
      <div class="side-label"><i class="fa-solid fa-layer-group"></i> Actions</div>
      <div class="tools-grid" id="actionsGridD"></div>
    </div>

    <div class="side-section">
      <div class="side-label"><i class="fa-solid fa-file-pdf"></i> Document</div>
      <label class="upload-btn" for="pdfInput"><i class="fa-solid fa-cloud-arrow-up"></i> Upload PDF / Image</label>
      <div class="file-info" id="fileInfo" style="display:none">
        <span class="name" id="fileName">—</span>
        <span id="fileMeta"></span>
      </div>
      <div class="page-controls">
        <button class="page-btn" id="prevPage"><i class="fa-solid fa-chevron-left"></i>Prev</button>
        <button class="page-btn" id="nextPage">Next<i class="fa-solid fa-chevron-right"></i></button>
      </div>
      <div class="page-controls" style="margin-top:6px">
        <button class="page-btn remove" id="removeFile"><i class="fa-solid fa-xmark"></i>Remove</button>
      </div>
    </div>

    <div class="side-section">
      <div class="side-label"><i class="fa-solid fa-tower-broadcast"></i> Status</div>
      <div class="status-line" id="statusLine">
        <i class="fa-solid fa-circle-notch"></i>
        <span class="room mono" id="roomText">—</span>
        <span id="netText"></span>
      </div>
    </div>
  </aside>
</div>

<div class="fab" id="fab">
  <div id="toolsGridM" style="display:flex;gap:4px;align-items:center"></div>
  <div class="divider"></div>
  <div id="colorsM" style="display:flex;gap:5px;align-items:center"></div>
  <div class="divider"></div>
  <div id="actionsGridM" style="display:flex;gap:4px;align-items:center"></div>
</div>

<div class="drawer-backdrop" id="backdrop"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>

  <div class="side-section">
    <div class="side-label"><i class="fa-solid fa-circle-half-stroke"></i> Size</div>
    <div class="slider-head"><span>Stroke</span><span class="mono" id="sizeValM">4px</span></div>
    <input type="range" id="sizeSliderM" min="1" max="30" value="4">
  </div>

  <div class="side-section">
    <div class="side-label"><i class="fa-solid fa-file-pdf"></i> Document</div>
    <label class="upload-btn" for="pdfInput"><i class="fa-solid fa-cloud-arrow-up"></i> Upload PDF / Image</label>
    <div class="file-info" id="fileInfoM" style="display:none">
      <span class="name" id="fileNameM">—</span>
      <span id="fileMetaM"></span>
    </div>
    <div class="page-controls">
      <button class="page-btn" id="prevPageM"><i class="fa-solid fa-chevron-left"></i>Prev</button>
      <button class="page-btn" id="nextPageM">Next<i class="fa-solid fa-chevron-right"></i></button>
    </div>
    <div class="page-controls" style="margin-top:6px">
      <button class="page-btn remove" id="removeFileM"><i class="fa-solid fa-xmark"></i>Remove</button>
    </div>
  </div>

  <div class="side-section">
    <div class="side-label"><i class="fa-solid fa-tower-broadcast"></i> Status</div>
    <div class="status-line" id="statusLineM">
      <i class="fa-solid fa-circle-notch"></i>
      <span class="room mono" id="roomTextM">—</span>
      <span id="netTextM"></span>
    </div>
  </div>
</div>

<input type="file" id="pdfInput" accept="application/pdf,image/*" style="display:none">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, doc, deleteDoc, getDocs,
  query, orderBy, onSnapshot, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYPaMZujQgCeJRMDsRJOuNanC_7kUN1xg",
  authDomain: "scren-cast.firebaseapp.com",
  projectId: "scren-cast",
  storageBucket: "scren-cast.firebasestorage.app",
  messagingSenderId: "534156223081",
  appId: "1:534156223081:web:a836dcfa0421781d0078f8",
  measurementId: "G-BD4PWD4HD3"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const pdfjsScript = document.createElement('script');
pdfjsScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
pdfjsScript.onload = () => {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  boot();
};
pdfjsScript.onerror = () => { boot(); };
document.head.appendChild(pdfjsScript);

// ============ DOM ============
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
const stage = $('stage');
const textInput = $('textInput');
const urlText = $('urlText'), copyBtn = $('copyBtn');
const liveDot = $('liveDot'), roleTag = $('roleTag');
const drawer = $('drawer'), backdrop = $('backdrop'), menuBtn = $('menuBtn');
const fab = $('fab');
const pdfInput = $('pdfInput');
const sidebar = $('sidebar');
const zoomLabel = $('zoomLabel');

// ============ WORLD / VIEW ============
// All object coordinates live in a fixed 1920x1080 "world". The view fits the
// world into the canvas (letterboxed) and preserves a pan/zoom transform on top.
const WORLD_W = 1920;
const WORLD_H = 1080;
let view = { scale: 1, offsetX: 0, offsetY: 0, userScale: 1, userPanX: 0, userPanY: 0 };

// ============ STATE ============
let roomId = null, isHost = false;
let dpr = 1, W = 0, H = 0;
let objects = [];
let currentTool = 'pen';
let currentColor = '#e11d48';
let currentSize = 4;
let drawing = false;
let startPt = null, liveObj = null;
let pdfImage = null;
let pdfAspect = null;
let pdfDoc = null, pdfPage = 1;
let pdfRenderCanvas = null;
let pdfLayerCanvas = null;   // cached scaled PDF bitmap for fast redraws
let editingTextId = null;
let pendingTextWorld = null;
let dragState = null;
let selectedId = null;
const undoStack = [];

const COLORS = ['#e11d48','#f59e0b','#22c55e','#2b6aff','#8b5cf6','#000000','#ffffff'];

const TOOLS = [
  { id:'pen',       icon:'fa-pen',          label:'Pen' },
  { id:'eraser',    icon:'fa-eraser',       label:'Eraser' },
  { id:'line',      icon:'fa-slash',        label:'Line' },
  { id:'arrow',     icon:'fa-arrow-right',  label:'Arrow' },
  { id:'rect',      icon:'fa-square',       label:'Rect' },
  { id:'circle',    icon:'fa-circle',       label:'Circle' },
  { id:'triangle',  icon:'fa-play',         label:'Tri' },
  { id:'text',      icon:'fa-font',         label:'Text' },
  { id:'select',    icon:'fa-arrow-pointer',label:'Select' },
];

const ACTIONS = [
  { id:'undo',   icon:'fa-rotate-left',  label:'Undo' },
  { id:'clear',  icon:'fa-trash',        label:'Clear' },
];

// ============ VIEW MATH ============
function computeView(){
  const baseScale = Math.min(W / WORLD_W, H / WORLD_H);
  const scale = baseScale * view.userScale;
  view.scale = scale;
  view.offsetX = (W - WORLD_W * scale) / 2 + view.userPanX;
  view.offsetY = (H - WORLD_H * scale) / 2 + view.userPanY;
  if (zoomLabel){
    zoomLabel.textContent = Math.round(view.userScale * 100) + '%';
  }
}
const toWorld = (sx, sy) => ({
  x: (sx - view.offsetX) / view.scale,
  y: (sy - view.offsetY) / view.scale
});
const toScreen = (wx, wy) => ({
  x: wx * view.scale + view.offsetX,
  y: wy * view.scale + view.offsetY
});

// ============ CANVAS SETUP ============
function resizeCanvas(){
  const r = stage.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  computeView();
  redraw();
}

// ============ PDF LAYER CACHE ============
function buildPdfLayer(){
  if (!pdfImage || !pdfImage.img){ pdfLayerCanvas = null; return; }
  const img = pdfImage.img;
  const aspect = pdfAspect || (img.width / img.height);
  const worldAspect = WORLD_W / WORLD_H;
  let w = WORLD_W, h = WORLD_H;
  if (aspect > worldAspect) h = WORLD_W / aspect;
  else w = WORLD_H * aspect;
  const x = (WORLD_W - w) / 2;
  const y = (WORLD_H - h) / 2;

  // Render bitmap at world resolution × a cache scale factor for crisp output
  const CACHE_SCALE = Math.min(2, Math.max(1, dpr * view.scale * 1.0));
  const cw = Math.round(w * CACHE_SCALE);
  const ch = Math.round(h * CACHE_SCALE);
  if (cw < 4 || ch < 4){ pdfLayerCanvas = null; return; }

  const c2 = document.createElement('canvas');
  c2.width = cw;
  c2.height = ch;
  const c2ctx = c2.getContext('2d');
  c2ctx.fillStyle = '#fff';
  c2ctx.fillRect(0, 0, cw, ch);
  c2ctx.drawImage(img, 0, 0, cw, ch);
  pdfLayerCanvas = { canvas: c2, worldRect: { x, y, w, h } };
}

// ============ RENDER ============
function redraw(){
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  // PDF layer (world-fitted, letterboxed)
  if (pdfLayerCanvas){
    const wr = pdfLayerCanvas.worldRect;
    const sx = view.offsetX + wr.x * view.scale;
    const sy = view.offsetY + wr.y * view.scale;
    const sw = wr.w * view.scale;
    const sh = wr.h * view.scale;
    ctx.drawImage(pdfLayerCanvas.canvas, sx, sy, sw, sh);
  }

  // World transform for objects
  ctx.save();
  ctx.translate(view.offsetX, view.offsetY);
  ctx.scale(view.scale, view.scale);

  for (const o of objects) drawObject(o);
  if (liveObj) drawObject(liveObj);
  ctx.restore();

  // Selection overlay in screen space
  if (selectedId){
    const o = objects.find(x => x.id === selectedId);
    if (o) drawSelection(o);
  }

  ctx.restore();
}

function drawObject(o){
  if (!o) return;
  ctx.save();
  ctx.strokeStyle = o.color;
  ctx.fillStyle = o.color;
  ctx.lineWidth = o.size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (o.type === 'stroke'){
    if (!o.pts || o.pts.length < 2){ ctx.restore(); return; }
    ctx.beginPath();
    ctx.moveTo(o.pts[0].x, o.pts[0].y);
    for (let i = 1; i < o.pts.length; i++) ctx.lineTo(o.pts[i].x, o.pts[i].y);
    ctx.stroke();
  }
  else if (o.type === 'line'){
    ctx.beginPath();
    ctx.moveTo(o.x1, o.y1);
    ctx.lineTo(o.x2, o.y2);
    ctx.stroke();
  }
  else if (o.type === 'arrow'){
    const angle = Math.atan2(o.y2 - o.y1, o.x2 - o.x1);
    const headLen = Math.max(10, o.size * 4);
    ctx.beginPath();
    ctx.moveTo(o.x1, o.y1);
    ctx.lineTo(o.x2, o.y2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(o.x2, o.y2);
    ctx.lineTo(o.x2 - headLen * Math.cos(angle - Math.PI / 6), o.y2 - headLen * Math.sin(angle - Math.PI / 6));
    ctx.moveTo(o.x2, o.y2);
    ctx.lineTo(o.x2 - headLen * Math.cos(angle + Math.PI / 6), o.y2 - headLen * Math.sin(angle + Math.PI / 6));
    ctx.stroke();
  }
  else if (o.type === 'rect'){
    const x = Math.min(o.x1, o.x2), y = Math.min(o.y1, o.y2);
    const w = Math.abs(o.x2 - o.x1), h = Math.abs(o.y2 - o.y1);
    ctx.strokeRect(x, y, w, h);
  }
  else if (o.type === 'circle'){
    const cx = (o.x1 + o.x2) / 2, cy = (o.y1 + o.y2) / 2;
    const rx = Math.abs(o.x2 - o.x1) / 2, ry = Math.abs(o.y2 - o.y1) / 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  else if (o.type === 'triangle'){
    const x1 = o.x1, y1 = o.y1, x2 = o.x2, y2 = o.y2;
    const x3 = (x1 + x2) / 2, y3 = y1;
    ctx.beginPath();
    ctx.moveTo(x1, y2);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y1);
    ctx.closePath();
    ctx.stroke();
  }
  else if (o.type === 'text'){
    const fs = o.size * 5;
    ctx.font = `600 ${fs}px Inter, sans-serif`;
    ctx.textBaseline = 'top';
    ctx.fillText(o.text, o.x, o.y);
  }

  ctx.restore();
}

function drawSelection(o){
  const box = getObjectBounds(o);
  if (!box) return;
  const tl = toScreen(box.x, box.y);
  const br = toScreen(box.x + box.w, box.y + box.h);
  const x = tl.x - 4, y = tl.y - 4;
  const w = br.x - tl.x + 8, h = br.y - tl.y + 8;

  ctx.save();
  ctx.strokeStyle = '#2b6aff';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 4]);
  ctx.strokeRect(x, y, w, h);
  ctx.setLineDash([]);

  const corners = [
    {x: x, y: y}, {x: x + w, y: y},
    {x: x, y: y + h}, {x: x + w, y: y + h}
  ];
  for (const c of corners){
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#2b6aff';
    ctx.lineWidth = 2;
    ctx.fillRect(c.x - 4, c.y - 4, 8, 8);
    ctx.strokeRect(c.x - 4, c.y - 4, 8, 8);
  }
  ctx.restore();
}

function getObjectBounds(o){
  if (o.type === 'stroke'){
    if (!o.pts || o.pts.length === 0) return null;
    let minX = o.pts[0].x, minY = o.pts[0].y, maxX = minX, maxY = minY;
    for (const p of o.pts){
      if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
    }
    return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  }
  if (o.type === 'text'){
    const c2 = document.createElement('canvas').getContext('2d');
    c2.font = `600 ${o.size * 5}px Inter, sans-serif`;
    const m = c2.measureText(o.text);
    return { x: o.x, y: o.y, w: m.width, h: o.size * 5 * 1.2 };
  }
  const x = Math.min(o.x1, o.x2);
  const y = Math.min(o.y1, o.y2);
  return { x, y, w: Math.abs(o.x2 - o.x1), h: Math.abs(o.y2 - o.y1) };
}

function hitTest(o, wx, wy){
  const b = getObjectBounds(o);
  if (!b) return false;
  const pad = 10;
  return wx >= b.x - pad && wx <= b.x + b.w + pad && wy >= b.y - pad && wy <= b.y + b.h + pad;
}

function strokeHit(o, wx, wy, radius){
  if (o.type !== 'stroke') return false;
  const r2 = radius * radius;
  for (const p of o.pts){
    const dx = p.x - wx, dy = p.y - wy;
    if (dx * dx + dy * dy <= r2) return true;
  }
  return false;
}

// ============ POINTER (pointer events with palm rejection) ============
let penActive = false;
let touchCount = 0;

function getPoint(e){
  const r = canvas.getBoundingClientRect();
  return toWorld(e.clientX - r.left, e.clientY - r.top);
}

function isMultiTouch(e){ return e.pointerType === 'touch' && touchCount > 1; }

function onPointerDown(e){
  if (!isHost) return;

  if (e.pointerType === 'touch') touchCount++;

  // Palm rejection: if pen is active, ignore touch
  if (e.pointerType === 'pen') penActive = true;
  if (e.pointerType === 'touch' && penActive) return;

  // Multi-touch on touch = pinch/pan gesture, cancel drawing
  if (isMultiTouch(e)){
    if (drawing) cancelLive();
    return;
  }

  if (editingTextId){ commitText(); return; }

  const p = getPoint(e);
  drawing = true;
  startPt = p;

  // SELECT: corner handles (screen-space hit)
  if (currentTool === 'select'){
    if (selectedId){
      const o = objects.find(x => x.id === selectedId);
      if (o){
        const box = getObjectBounds(o);
        const corners = [
          { x: box.x, y: box.y, corner: 'tl' },
          { x: box.x + box.w, y: box.y, corner: 'tr' },
          { x: box.x, y: box.y + box.h, corner: 'bl' },
          { x: box.x + box.w, y: box.y + box.h, corner: 'br' }
        ];
        const screenP = toScreen(p.x, p.y);
        for (const c of corners){
          const sc = toScreen(c.x, c.y);
          if (Math.abs(screenP.x - sc.x) < 16 && Math.abs(screenP.y - sc.y) < 16){
            dragState = {
              type: 'resize', id: selectedId, corner: c.corner,
              orig: JSON.parse(JSON.stringify(o)), startPt: p
            };
            canvas.setPointerCapture?.(e.pointerId);
            return;
          }
        }
      }
    }
    for (let i = objects.length - 1; i >= 0; i--){
      if (hitTest(objects[i], p.x, p.y)){
        selectedId = objects[i].id;
        dragState = {
          type: 'move', id: selectedId, startPt: p,
          orig: JSON.parse(JSON.stringify(objects[i]))
        };
        redraw();
        canvas.setPointerCapture?.(e.pointerId);
        return;
      }
    }
    selectedId = null;
    redraw();
    return;
  }

  // TEXT: tap to place
  if (currentTool === 'text'){
    placeTextInput(p);
    drawing = false;
    return;
  }

  // ERASER: delete strokes within radius
  if (currentTool === 'eraser'){
    const radius = Math.max(14, (currentSize * 4) / Math.max(0.2, view.scale));
    const removed = [];
    for (const o of objects){
      if (o.type === 'stroke' && strokeHit(o, p.x, p.y, radius)) removed.push(o.id);
    }
    if (removed.length){
      objects = objects.filter(o => !removed.includes(o.id));
      for (const id of removed){ undoStack.push({ type: 'delete', id }); deleteObject(id); }
      redraw();
    }
    liveObj = { id: genId(), type: 'stroke', color: '#cccccc', size: currentSize * 3, pts: [p], _eraserVisual: true };
    return;
  }

  // DRAWING TOOLS
  if (currentTool === 'pen'){
    liveObj = { id: genId(), type: 'stroke', color: currentColor, size: currentSize, pts: [p] };
  } else if (currentTool === 'line' || currentTool === 'arrow' ||
             currentTool === 'rect' || currentTool === 'circle' || currentTool === 'triangle'){
    liveObj = {
      id: genId(), type: currentTool, color: currentColor, size: currentSize,
      x1: p.x, y1: p.y, x2: p.x, y2: p.y
    };
  }
  canvas.setPointerCapture?.(e.pointerId);
}

function onPointerMove(e){
  if (e.pointerType === 'touch' && penActive) return;
  if (!drawing || !isHost) return;
  const p = getPoint(e);

  if (currentTool === 'select' && dragState){
    const o = objects.find(x => x.id === dragState.id);
    if (!o) return;
    if (dragState.type === 'move'){
      const dx = p.x - dragState.startPt.x;
      const dy = p.y - dragState.startPt.y;
      applyTranslate(o, dragState.orig, dx, dy);
    } else if (dragState.type === 'resize'){
      applyResize(o, dragState.orig, dragState.corner, p);
    }
    redraw();
    return;
  }

  // Eraser drag
  if (currentTool === 'eraser' && liveObj && liveObj._eraserVisual){
    const radius = Math.max(14, (currentSize * 4) / Math.max(0.2, view.scale));
    liveObj.pts.push(p);
    let changed = false;
    for (let i = objects.length - 1; i >= 0; i--){
      const o = objects[i];
      if (o.type === 'stroke' && strokeHit(o, p.x, p.y, radius)){
        objects.splice(i, 1);
        undoStack.push({ type: 'delete', id: o.id });
        deleteObject(o.id);
        changed = true;
      }
    }
    redraw();
    return;
  }

  if (!liveObj) return;
  if (liveObj.type === 'stroke'){
    liveObj.pts.push(p);
  } else {
    liveObj.x2 = p.x;
    liveObj.y2 = p.y;
  }
  redraw();
}

function onPointerUp(e){
  if (e.pointerType === 'touch') touchCount = Math.max(0, touchCount - 1);
  if (e.pointerType === 'pen') penActive = false;

  if (currentTool === 'select' && dragState){
    const o = objects.find(x => x.id === dragState.id);
    if (o) saveObject(o, true);
    dragState = null;
    drawing = false;
    return;
  }

  if (!drawing){ liveObj = null; return; }
  drawing = false;

  if (currentTool === 'eraser'){
    liveObj = null;
    redraw();
    return;
  }

  if (!liveObj) return;

  if (liveObj.type === 'stroke' && liveObj.pts.length < 2){ liveObj = null; redraw(); return; }

  objects.push(liveObj);
  undoStack.push({ type: 'create', id: liveObj.id });
  saveObject(liveObj);
  liveObj = null;
  startPt = null;
  redraw();
}

function cancelLive(){
  liveObj = null;
  drawing = false;
  dragState = null;
  redraw();
}

function applyTranslate(o, orig, dx, dy){
  if (o.type === 'stroke') o.pts = orig.pts.map(p => ({ x: p.x + dx, y: p.y + dy }));
  else if (o.type === 'text') { o.x = orig.x + dx; o.y = orig.y + dy; }
  else { o.x1 = orig.x1 + dx; o.y1 = orig.y1 + dy; o.x2 = orig.x2 + dx; o.y2 = orig.y2 + dy; }
}

function applyResize(o, orig, corner, p){
  const b = (() => {
    if (orig.type === 'stroke'){
      let minX = orig.pts[0].x, minY = orig.pts[0].y, maxX = minX, maxY = minY;
      for (const q of orig.pts){
        if (q.x < minX) minX = q.x; if (q.y < minY) minY = q.y;
        if (q.x > maxX) maxX = q.x; if (q.y > maxY) maxY = q.y;
      }
      return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    }
    if (orig.type === 'text'){
      const c2 = document.createElement('canvas').getContext('2d');
      c2.font = `600 ${orig.size * 5}px Inter, sans-serif`;
      const m = c2.measureText(orig.text);
      return { x: orig.x, y: orig.y, w: m.width, h: orig.size * 5 * 1.2 };
    }
    return {
      x: Math.min(orig.x1, orig.x2), y: Math.min(orig.y1, orig.y2),
      w: Math.abs(orig.x2 - orig.x1), h: Math.abs(orig.y2 - orig.y1)
    };
  })();

  let newX = b.x, newY = b.y, newW = b.w, newH = b.h;
  if (corner === 'tl') { newX = p.x; newY = p.y; newW = b.x + b.w - p.x; newH = b.y + b.h - p.y; }
  if (corner === 'tr') { newY = p.y; newW = p.x - b.x; newH = b.y + b.h - p.y; }
  if (corner === 'bl') { newX = p.x; newW = b.x + b.w - p.x; newH = p.y - b.y; }
  if (corner === 'br') { newW = p.x - b.x; newH = p.y - b.y; }

  if (newW < 10) newW = 10;
  if (newH < 10) newH = 10;

  const sx = newW / Math.max(1, b.w), sy = newH / Math.max(1, b.h);

  if (o.type === 'stroke'){
    o.pts = orig.pts.map(q => ({
      x: newX + (q.x - b.x) * sx,
      y: newY + (q.y - b.y) * sy
    }));
  } else if (o.type === 'text'){
    o.x = newX; o.y = newY;
    const newFontSize = Math.max(8, orig.size * 5 * sy);
    o.size = newFontSize / 5;
  } else {
    o.x1 = newX; o.y1 = newY;
    o.x2 = newX + newW; o.y2 = newY + newH;
  }
}

// ============ TEXT INPUT ============
function placeTextInput(worldPt){
  pendingTextWorld = worldPt;
  const s = toScreen(worldPt.x, worldPt.y);
  const fontPx = Math.max(12, currentSize * 5 * view.scale);
  textInput.style.left = s.x + 'px';
  textInput.style.top = (s.y - 2) + 'px';
  textInput.style.fontSize = fontPx + 'px';
  textInput.value = '';
  textInput.classList.add('show');
  setTimeout(() => textInput.focus(), 10);
  editingTextId = 'new';
}

function editExistingText(o){
  pendingTextWorld = { x: o.x, y: o.y };
  const s = toScreen(o.x, o.y);
  const fontPx = Math.max(12, o.size * 5 * view.scale);
  textInput.style.left = s.x + 'px';
  textInput.style.top = (s.y - 2) + 'px';
  textInput.style.fontSize = fontPx + 'px';
  textInput.value = o.text;
  textInput.classList.add('show');
  setTimeout(() => textInput.focus(), 10);
  editingTextId = o.id;
}

function commitText(){
  const val = textInput.value.trim();
  textInput.classList.remove('show');
  textInput.blur();
  if (!val){ editingTextId = null; pendingTextWorld = null; return; }

  if (editingTextId === 'new'){
    if (pendingTextWorld){
      const o = {
        id: genId(), type: 'text', color: currentColor, size: currentSize,
        x: pendingTextWorld.x, y: pendingTextWorld.y, text: val
      };
      objects.push(o);
      undoStack.push({ type: 'create', id: o.id });
      saveObject(o);
    }
  } else {
    const o = objects.find(x => x.id === editingTextId);
    if (o){ o.text = val; saveObject(o, true); }
  }
  editingTextId = null;
  pendingTextWorld = null;
  redraw();
}
textInput.addEventListener('blur', () => { if (editingTextId) commitText(); });
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter'){ e.preventDefault(); commitText(); }
  if (e.key === 'Escape'){
    textInput.value = ''; editingTextId = null; pendingTextWorld = null;
    textInput.classList.remove('show');
  }
});

// ============ FIREBASE ============
function genId(){
  const a = new Uint8Array(6); crypto.getRandomValues(a);
  return Array.from(a, n => 'abcdefghijklmnopqrstuvwxyz0123456789'[n % 36]).join('');
}

async function saveObject(o, isUpdate){
  if (!isHost) return;
  try {
    const data = JSON.parse(JSON.stringify(o));
    delete data._bw; delete data._bh; delete data._eraserVisual;
    if (isUpdate){
      await setDoc(doc(db, 'rooms', roomId, 'objects', o.id), data, { merge: true });
    } else {
      data.t = serverTimestamp();
      await setDoc(doc(db, 'rooms', roomId, 'objects', o.id), data);
    }
    setStatus('ok', 'Synced');
  } catch (e){
    console.warn(e);
    setStatus('err', e.code || 'save error');
  }
}

async function deleteObject(id){
  try { await deleteDoc(doc(db, 'rooms', roomId, 'objects', id)); } catch(e){ console.warn(e); }
}

async function clearAll(){
  try {
    const snap = await getDocs(collection(db, 'rooms', roomId, 'objects'));
    await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
    setStatus('ok', 'Cleared');
  } catch(e){ console.warn(e); }
}

function subscribeObjects(){
  const q = query(collection(db, 'rooms', roomId, 'objects'), orderBy('t'));
  onSnapshot(q, (snap) => {
    const seen = new Set();
    snap.forEach(d => {
      const data = d.data();
      delete data.t;
      const existing = objects.findIndex(x => x.id === d.id);
      if (existing >= 0) objects[existing] = data;
      else objects.push(data);
      seen.add(d.id);
    });
    objects = objects.filter(o => seen.has(o.id));
    redraw();
    if (!isHost) setStatus('', `Watching · ${objects.length} objects`);
  }, (err) => {
    console.warn(err);
    setStatus('err', err.code || 'error');
    liveDot.classList.add('err');
  });
}

// ============ PDF ============
function compressPage(){
  const maxW = 1400;
  const src = pdfRenderCanvas;
  const scale = Math.min(1, maxW / src.width);
  const c2 = document.createElement('canvas');
  c2.width = Math.round(src.width * scale);
  c2.height = Math.round(src.height * scale);
  const c2ctx = c2.getContext('2d');
  c2ctx.fillStyle = '#fff';
  c2ctx.fillRect(0, 0, c2.width, c2.height);
  c2ctx.drawImage(src, 0, 0, c2.width, c2.height);
  return c2.toDataURL('image/jpeg', 0.6);
}

async function savePdfPage(){
  if (!isHost) return;
  try {
    const dataUrl = compressPage();
    const sizeKB = Math.round(dataUrl.length / 1024);
    await setDoc(doc(db, 'rooms', roomId), {
      pdf: dataUrl, pageNum: pdfPage, pageSize: sizeKB,
      aspect: pdfRenderCanvas.width / pdfRenderCanvas.height
    }, { merge: true });
    setStatus('ok', `Page · ${sizeKB}KB`);
  } catch(e){
    console.warn(e);
    setStatus('err', e.code || 'page too large');
  }
}

function subscribeRoom(){
  onSnapshot(doc(db, 'rooms', roomId), (snap) => {
    if (!snap.exists()) return;
    const data = snap.data();
    if (data.pdf){
      // Only replace if different from current
      if (!pdfImage || pdfImage.raw !== data.pdf){
        const img = new Image();
        img.onload = () => {
          pdfImage = { img, raw: data.pdf };
          if (data.aspect) pdfAspect = data.aspect;
          else pdfAspect = img.width / img.height;
          buildPdfLayer();
          redraw();
        };
        img.src = data.pdf;
      }
      if (data.aspect) pdfAspect = data.aspect;
    } else if (pdfImage){
      pdfImage = null;
      pdfAspect = null;
      pdfLayerCanvas = null;
      redraw();
    }
    if (data.pageNum){
      setFileMeta(`Page ${data.pageNum}${data.pageSize ? ' · ' + data.pageSize + 'KB' : ''}`);
    }
  });
}

pdfInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (file.type.startsWith('image/')){
    const img = new Image();
    img.onload = () => {
      pdfRenderCanvas = document.createElement('canvas');
      const maxW = 1400;
      const scale = Math.min(1, maxW / img.width);
      pdfRenderCanvas.width = Math.round(img.width * scale);
      pdfRenderCanvas.height = Math.round(img.height * scale);
      const c2 = pdfRenderCanvas.getContext('2d');
      c2.fillStyle = '#fff';
      c2.fillRect(0, 0, pdfRenderCanvas.width, pdfRenderCanvas.height);
      c2.drawImage(img, 0, 0, pdfRenderCanvas.width, pdfRenderCanvas.height);
      setFileName(file.name);
      if (isHost) savePdfPage();
    };
    img.src = URL.createObjectURL(file);
    return;
  }

  if (file.type === 'application/pdf'){
    try {
      if (!window.pdfjsLib){ setFileName('PDF lib not loaded'); return; }
      const buf = await file.arrayBuffer();
      pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
      pdfPage = 1;
      setFileName(file.name);
      await renderPdf();
    } catch (err){
      console.warn(err);
      setFileName('Failed to read PDF');
    }
  }
};

async function renderPdf(){
  if (!pdfDoc) return;
  const page = await pdfDoc.getPage(pdfPage);
  let viewport = page.getViewport({ scale: 1 });
  const maxDim = 1600;
  const s = Math.min(maxDim / viewport.width, maxDim / viewport.height);
  viewport = page.getViewport({ scale: s });

  pdfRenderCanvas = document.createElement('canvas');
  pdfRenderCanvas.width = viewport.width;
  pdfRenderCanvas.height = viewport.height;
  const pctx = pdfRenderCanvas.getContext('2d');
  pctx.fillStyle = '#fff';
  pctx.fillRect(0, 0, viewport.width, viewport.height);

  await page.render({ canvasContext: pctx, viewport }).promise;
  setFileMeta(`Page ${pdfPage} of ${pdfDoc.numPages}`);
  if (isHost) await savePdfPage();
}

function setFileName(name){
  ['fileName','fileNameM'].forEach(id => { const el = $(id); if (el) el.textContent = name || '—'; });
  ['fileInfo','fileInfoM'].forEach(id => { const el = $(id); if (el) el.style.display = name ? 'block' : 'none'; });
}
function setFileMeta(text){
  ['fileMeta','fileMetaM'].forEach(id => { const el = $(id); if (el) el.textContent = text || ''; });
}

// ============ UI ============
function setStatus(type, text){
  ['statusLine','statusLineM'].forEach(id => {
    const el = $(id); if (!el) return;
    const icon = el.querySelector('i');
    el.classList.remove('ok','err');
    if (type) el.classList.add(type);
    icon.className = 'fa-solid ' + (
      type === 'ok' ? 'fa-circle-check' :
      type === 'err' ? 'fa-circle-exclamation' : 'fa-circle-notch'
    );
    const t = el.querySelector('span:last-child');
    if (t) t.textContent = text ? ` · ${text}` : '';
  });
}

function buildToolButtons(container, isMobile){
  container.innerHTML = '';
  TOOLS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = (isMobile ? 'tool' : 'tool-btn') + (currentTool === t.id ? ' active' : '');
    btn.dataset.tool = t.id;
    btn.innerHTML = `<i class="fa-solid ${t.icon}"></i>` + (isMobile ? '' : t.label);
    btn.title = t.label;
    btn.onclick = () => setTool(t.id);
    container.appendChild(btn);
  });
}
function buildActionButtons(container, isMobile){
  container.innerHTML = '';
  ACTIONS.forEach(a => {
    const btn = document.createElement('button');
    btn.className = (isMobile ? 'tool' : 'tool-btn') + (a.id === 'clear' ? ' danger' : '');
    btn.innerHTML = `<i class="fa-solid ${a.icon}"></i>` + (isMobile ? '' : a.label);
    btn.title = a.label;
    btn.onclick = () => doAction(a.id);
    container.appendChild(btn);
  });
}
function buildColors(container, isDesktop){
  container.innerHTML = '';
  COLORS.forEach(c => {
    const b = document.createElement('div');
    b.className = (isDesktop ? 'swatch-lg' : 'swatch') +
                  (c === currentColor ? ' active' : '') +
                  (c === '#ffffff' ? ' white' : '');
    b.style.background = c;
    b.onclick = () => { currentColor = c; rebuildColors(); };
    container.appendChild(b);
  });
}
function rebuildColors(){
  buildColors($('colorsD'), true);
  buildColors($('colorsM'), false);
}
function setTool(id){
  currentTool = id;
  document.querySelectorAll('[data-tool]').forEach(el => {
    el.classList.toggle('active', el.dataset.tool === id);
  });
  if (editingTextId && id !== 'text') commitText();
  canvas.style.cursor = id === 'select' ? 'default' :
                        id === 'text' ? 'text' : 'crosshair';
}
async function doAction(id){
  if (id === 'clear'){
    objects = []; selectedId = null; redraw();
    if (isHost) await clearAll();
  }
  if (id === 'undo'){
    if (objects.length === 0) return;
    const last = objects.pop();
    if (selectedId === last.id) selectedId = null;
    redraw();
    if (isHost) deleteObject(last.id);
  }
}

// ============ ROOM ============
function getRoom(){
  const p = location.pathname.replace(/^\/|\/$/g, '');
  return /^[a-zA-Z0-9_-]{4,32}$/.test(p) ? p : null;
}
function newRoom(){
  const a = new Uint8Array(8); crypto.getRandomValues(a);
  return Array.from(a, n => 'abcdefghijklmnopqrstuvwxyz0123456789'[n % 36]).join('');
}
copyBtn.onclick = async () => {
  const link = location.origin + '/' + roomId;
  try {
    await navigator.clipboard.writeText(link);
    copyBtn.classList.add('ok');
    copyBtn.innerHTML = '<i class="fa-solid fa-check"></i><span>Copied</span>';
    setTimeout(() => {
      copyBtn.classList.remove('ok');
      copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i><span>Copy</span>';
    }, 1500);
  } catch { prompt('Copy:', link); }
};

// ============ ZOOM ============
function setZoom(z, cx, cy){
  z = Math.max(0.3, Math.min(5, z));
  // Zoom about a screen point (defaults to canvas center)
  const px = (cx != null ? cx : W / 2);
  const py = (cy != null ? cy : H / 2);
  // World point under the anchor
  const before = toWorld(px, py);
  view.userScale = z;
  computeView();
  const after = toWorld(px, py);
  // Adjust userPan so `before` stays under the anchor
  view.userPanX += (after.x - before.x) * view.scale;
  view.userPanY += (after.y - before.y) * view.scale;
  computeView();
  redraw();
  // Update cache for crispness
  buildPdfLayer();
  redraw();
}

// ============ EVENT WIRING ============
function wireEvents(){
  // Use Pointer Events for unified mouse/touch/pen handling
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('pointerleave', (e) => {
    // Only commit on leaving the canvas if we were drawing
    if (drawing) onPointerUp(e);
  });

  // Prevent scrolling while drawing
  canvas.addEventListener('touchmove', (e) => { if (drawing) e.preventDefault(); }, { passive: false });

  // Wheel zoom
  canvas.addEventListener('wheel', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey){
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      setZoom(view.userScale * factor, e.clientX - r.left, e.clientY - r.top);
    }
  }, { passive: false });

  // Two-finger pinch pan/zoom
  let pinch = null;
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2){
      e.preventDefault();
      cancelLive();
      const r = canvas.getBoundingClientRect();
      const t1 = e.touches[0], t2 = e.touches[1];
      const cx = ((t1.clientX + t2.clientX) / 2) - r.left;
      const cy = ((t1.clientY + t2.clientY) / 2) - r.top;
      const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      pinch = { startDist: dist, startScale: view.userScale, cx, cy, startPan: {x: view.userPanX, y: view.userPanY}, startMid: {x: cx, y: cy} };
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinch){
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      const t1 = e.touches[0], t2 = e.touches[1];
      const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      const mid = {
        x: ((t1.clientX + t2.clientX) / 2) - r.left,
        y: ((t1.clientY + t2.clientY) / 2) - r.top
      };
      const factor = dist / Math.max(1, pinch.startDist);
      view.userScale = Math.max(0.3, Math.min(5, pinch.startScale * factor));
      view.userPanX = pinch.startPan.x + (mid.x - pinch.startMid.x);
      view.userPanY = pinch.startPan.y + (mid.y - pinch.startMid.y);
      computeView();
      redraw();
    }
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) pinch = null;
    if (e.touches.length === 0) touchCount = 0;
  });

  // Double-tap text to edit
  let lastTap = 0, lastTapPos = null;
  canvas.addEventListener('click', (e) => {
    if (!isHost || currentTool !== 'select') return;
    const r = canvas.getBoundingClientRect();
    const p = toWorld(e.clientX - r.left, e.clientY - r.top);
    const now = Date.now();
    if (now - lastTap < 300 && lastTapPos &&
        Math.hypot(p.x - lastTapPos.x, p.y - lastTapPos.y) < 30){
      for (let i = objects.length - 1; i >= 0; i--){
        const o = objects[i];
        if (o.type === 'text' && hitTest(o, p.x, p.y)){ editExistingText(o); break; }
      }
    }
    lastTap = now; lastTapPos = p;
  });

  // Size sliders
  const sizeHandler = (v) => {
    currentSize = +v;
    $('sizeVal').textContent = v + 'px';
    $('sizeValM').textContent = v + 'px';
    $('sizeSlider').value = v;
    $('sizeSliderM').value = v;
  };
  $('sizeSlider').oninput = e => sizeHandler(e.target.value);
  $('sizeSliderM').oninput = e => sizeHandler(e.target.value);

  // PDF page controls
  const prevFn = () => { if (pdfDoc && pdfPage > 1){ pdfPage--; renderPdf(); } };
  const nextFn = () => { if (pdfDoc && pdfPage < pdfDoc.numPages){ pdfPage++; renderPdf(); } };
  $('prevPage').onclick = prevFn; $('prevPageM').onclick = prevFn;
  $('nextPage').onclick = nextFn; $('nextPageM').onclick = nextFn;

  const removeFn = async () => {
    pdfDoc = null; pdfRenderCanvas = null; pdfImage = null; pdfAspect = null; pdfLayerCanvas = null;
    setFileName(null); setFileMeta('');
    redraw();
    if (isHost) await setDoc(doc(db, 'rooms', roomId), { pdf: null, pageNum: null, pageSize: null, aspect: null }, { merge: true });
  };
  $('removeFile').onclick = removeFn;
  $('removeFileM').onclick = removeFn;

  menuBtn.onclick = () => {
    const open = drawer.classList.contains('open');
    drawer.classList.toggle('open', !open);
    backdrop.classList.toggle('open', !open);
    fab.classList.toggle('hidden', !open ? false : true);
  };
  backdrop.onclick = () => {
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    if (isHost) fab.classList.remove('hidden');
  };

  // Zoom controls
  $('zoomIn').onclick = () => setZoom(view.userScale * 1.2);
  $('zoomOut').onclick = () => setZoom(view.userScale / 1.2);
  $('zoomReset').onclick = () => {
    view.userScale = 1; view.userPanX = 0; view.userPanY = 0;
    computeView();
    buildPdfLayer();
    redraw();
  };

  // Keyboard shortcuts
  window.addEventListener('keydown', (e) => {
    if (!isHost) return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
      e.preventDefault(); doAction('undo'); return;
    }
    if (e.key === 'Delete' || e.key === 'Backspace'){
      if (selectedId){
        e.preventDefault();
        objects = objects.filter(o => o.id !== selectedId);
        if (isHost) deleteObject(selectedId);
        selectedId = null;
        redraw();
      }
      return;
    }
    const map = {
      'p':'pen','e':'eraser','l':'line','a':'arrow','r':'rect',
      'c':'circle','t':'text','v':'select','s':'triangle'
    };
    const k = e.key.toLowerCase();
    if (map[k]){ setTool(map[k]); return; }
    if (e.key === 'Escape'){ selectedId = null; redraw(); }
  });

  // Prevent scroll-while-drawing globally
  document.addEventListener('touchmove', (e) => {
    if (drawing) e.preventDefault();
  }, { passive: false });
}

// ============ BOOT ============
async function boot(){
  buildToolButtons($('toolsGridD'), false);
  buildToolButtons($('toolsGridM'), true);
  buildActionButtons($('actionsGridD'), false);
  buildActionButtons($('actionsGridM'), true);
  rebuildColors();
  wireEvents();

  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 250));

  await new Promise(r => requestAnimationFrame(r));
  resizeCanvas();

  const existing = getRoom();
  if (existing){
    isHost = false;
    roomId = existing;
    urlText.textContent = location.origin + '/' + roomId;
    roleTag.textContent = 'Viewer';
    roleTag.classList.remove('host');
    fab.classList.add('hidden');
    sidebar.classList.add('viewer');
    canvas.style.cursor = 'default';
    setStatus('', 'Connected');
  } else {
    isHost = true;
    roomId = newRoom();
    history.replaceState({}, '', '/' + roomId);
    urlText.textContent = location.origin + '/' + roomId;
    roleTag.textContent = 'Host';
    roleTag.classList.add('host');
    try {
      await setDoc(doc(db, 'rooms', roomId), { created: serverTimestamp() }, { merge: true });
      setStatus('ok', 'Connected');
    } catch (e){ setStatus('err', e.code || 'error'); }
  }

  ['roomText','roomTextM'].forEach(id => { const el = $(id); if (el) el.textContent = roomId; });
  liveDot.classList.add('on');

  subscribeObjects();
  subscribeRoom();

  setTool('pen');
}

window.addEventListener('beforeunload', () => {});
</script>
